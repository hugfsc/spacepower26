<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SPC26 Scout">
<meta name="theme-color" content="#1F2A44">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png"><link rel="icon" href="icon-192.png">
<title>SpacePowerScout26</title>
<style>
:root{--navy:#1F2A44;--navy2:#2B3A5E;--bg:#F2F4F8;--card:#fff;--line:#DDE1EA;--txt:#1B2233;--mut:#667089;--A:#D64545;--B:#E59E1A;--C:#3B7DD8;--D:#8A93A6;--ok:#2E9E5B;--acc:#0E8F8F}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:15px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
body{display:flex;flex-direction:column;overflow:hidden}
header{background:var(--navy);color:#fff;padding:calc(env(safe-area-inset-top) + 8px) 14px 8px;display:flex;align-items:center;gap:10px;flex:none}
header h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.2px}
header .sub{font-size:11px;color:#A9B6D6}
header .sp{flex:1}
.pill{font-size:11px;padding:3px 8px;border-radius:12px;background:var(--navy2);color:#cfd9f2}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 10px 90px}
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:20}
nav button{flex:1;background:none;border:0;padding:8px 0 6px;font-size:10.5px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button .ic{font-size:20px;line-height:1}
nav button.on{color:var(--navy);font-weight:700}
nav button.on .ic{transform:scale(1.1)}
.fab{position:fixed;right:14px;bottom:calc(70px + env(safe-area-inset-bottom));width:52px;height:52px;border-radius:26px;background:var(--acc);color:#fff;border:0;font-size:24px;box-shadow:0 3px 10px rgba(0,0,0,.3);z-index:21}
input,select,textarea{width:100%;font:inherit;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--txt)}
textarea{min-height:90px;resize:vertical}
label{display:block;font-size:12px;color:var(--mut);margin:10px 0 3px;font-weight:600}
.btn{border:0;border-radius:10px;padding:11px 14px;font:inherit;font-weight:600;background:var(--navy);color:#fff}
.btn.sec{background:#fff;color:var(--navy);border:1px solid var(--navy)}
.btn.acc{background:var(--acc)}
.btn.red{background:var(--A)}
.btn.sm{padding:7px 10px;font-size:13px}
.btn.block{display:block;width:100%}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
.row.nf>*{flex:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:8px}
.card.tap:active{background:#eef2fa}
.card h3{margin:0;font-size:15px}
.mut{color:var(--mut);font-size:12.5px}
.chip{display:inline-block;padding:5px 11px;border-radius:16px;border:1px solid var(--line);background:#fff;font-size:12.5px;margin:0 6px 6px 0;color:var(--txt)}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.badge{display:inline-block;min-width:26px;text-align:center;padding:2px 7px;border-radius:10px;color:#fff;font-weight:700;font-size:12px}
.bA{background:var(--A)}.bB{background:var(--B)}.bC{background:var(--C)}.bD{background:var(--D)}
.booth{display:inline-block;background:#E8ECF5;color:var(--navy);padding:2px 7px;border-radius:6px;font-weight:700;font-size:12px}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:9px;background:#EEF1F7;color:#475069;margin-right:4px}
.tag.hot{background:#FFD9D6;color:#9B1C1C}.tag.warm{background:#FFEBC2;color:#8A5A00}.tag.cold{background:#DCE9FB;color:#1F4F9C}.tag.ok{background:#D6F2E1;color:#17703E}.tag.no{background:#F4DADA;color:#9B1C1C}
.sheet{position:fixed;inset:0;background:rgba(10,15,30,.55);z-index:50;display:flex;align-items:flex-end}
.sheet .in{background:var(--bg);width:100%;max-height:94vh;overflow-y:auto;border-radius:16px 16px 0 0;padding:14px 14px calc(24px + env(safe-area-inset-bottom))}
.sheet .hd{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.sheet .hd h2{flex:1;margin:0;font-size:17px}
.x{background:#E3E7F0;border:0;border-radius:16px;width:32px;height:32px;font-size:16px}
.kv{display:grid;grid-template-columns:92px 1fr;gap:4px 8px;font-size:13.5px;margin:6px 0}
.kv b{color:var(--mut);font-weight:600;font-size:12px;padding-top:1px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.big{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:18px 8px;font-size:15px}
.big .ic{font-size:30px}
.chk{display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-bottom:1px solid #EEF0F5;font-size:14px}
.chk input{width:20px;height:20px;margin-top:1px;flex:none}
#mapbox{position:relative;width:100%;height:56vh;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;touch-action:none}
#mapinner{position:absolute;left:0;top:0;transform-origin:0 0}
#mapinner img,#mapinner svg{position:absolute;left:0;top:0;width:100%;height:100%;user-select:none;-webkit-user-drag:none}
.zc{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px;z-index:3}
.zc button{width:38px;height:38px;border-radius:19px;border:1px solid var(--line);background:#fff;font-size:20px;font-weight:700}
.pulse{animation:pl 1.2s infinite}
@keyframes pl{0%{opacity:1}50%{opacity:.25}100%{opacity:1}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(120px + env(safe-area-inset-bottom));background:#111a;background:rgba(20,26,44,.92);color:#fff;padding:10px 16px;border-radius:20px;z-index:99;font-size:13.5px;max-width:90vw;text-align:center}
#cam{position:fixed;inset:0;background:#000;z-index:80;display:flex;flex-direction:column}
#cam video{flex:1;width:100%;object-fit:cover;min-height:0}
#cam .bar{padding:12px;display:flex;gap:8px;background:#000}
#cam .bar .btn{flex:1}
.qrbox{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center}
.qrbox svg,.qrbox img{width:100%;max-width:300px;height:auto}
.full{position:fixed;inset:0;background:#fff;z-index:90;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.full svg,.full img{width:min(92vw,70vh);height:auto}
h4{margin:14px 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--mut)}
.warn{background:#FFF4D6;border:1px solid #F0D58A;color:#6B4B00;border-radius:10px;padding:8px 10px;font-size:12.5px;margin:8px 0}
.leg{display:flex;gap:10px;flex-wrap:wrap;font-size:11.5px;color:var(--mut);margin:6px 2px}
.leg i{display:inline-block;width:10px;height:10px;border-radius:5px;margin-right:4px;vertical-align:-1px}
</style>
</head>
<body>
<header>
  <div><h1>SpacePowerScout26</h1><div class="sub">Spacepower 2026 · Hilton Orlando · Dec 8-10</div></div>
  <div class="sp"></div>
  <span class="pill" id="syncPill">0 to sync</span>
</header>
<main id="main"></main>
<button class="fab" id="fab" title="Quick note">✎</button>
<nav id="nav"></nav>
<div id="overlay"></div>

function filtered(){
  const q=S.q.trim().toLowerCase();
  let L=EXH.filter(e=>S.pf.includes(e.priority));
  if(S.terr)L=L.filter(e=>e.territory===S.terr);
  if(S.type)L=L.filter(e=>e.type===S.type);
  if(q)L=L.filter(e=>(e.name+' '+e.booth+' '+e.city+' '+e.state+' '+e.focus+' '+e.where+' '+e.owner).toLowerCase().includes(q));
  const bn=e=>/^\d+$/.test(e.booth)?parseInt(e.booth):99999;
  if(S.sort==='pri')L.sort((a,b)=>a.priority.localeCompare(b.priority)||bn(a)-bn(b));
  else if(S.sort==='booth')L.sort((a,b)=>bn(a)-bn(b)||a.booth.localeCompare(b.booth));
  else if(S.sort==='route')L.sort((a,b)=>(a.route||999)-(b.route||999));
  else L.sort((a,b)=>a.name.localeCompare(b.name));
  return L;
}

function applyT(){const inn=$('#mapinner');if(!inn)return;inn.style.transform=`translate(${M.tx}px,${M.ty}px) scale(${M.k})`;drawPins()}
function clampT(){const b=$('#mapbox'),dim=MAPDIM[S.mapImg];const w=dim[0]*M.k,h=dim[1]*M.k;
  M.tx=w<b.clientWidth?(b.clientWidth-w)/2:Math.min(0,Math.max(b.clientWidth-w,M.tx));
  M.ty=h<b.clientHeight?(b.clientHeight-h)/2:Math.min(0,Math.max(b.clientHeight-h,M.ty))}
function zoomAt(cx,cy,nk){nk=Math.max(M.k0*0.9,Math.min(M.k0*6,nk));const r=nk/M.k;M.tx=cx-(cx-M.tx)*r;M.ty=cy-(cy-M.ty)*r;M.k=nk;clampT();applyT()}
function zoomTo(x,y,k){const b=$('#mapbox');M.k=Math.min(M.k0*6,M.k0*2.0);M.tx=b.clientWidth/2-x*M.k;M.ty=b.clientHeight/2-y*M.k;clampT();applyT()}
function initMap(dim){
  const b=$('#mapbox');M.k0=Math.min(b.clientWidth/dim[0],b.clientHeight/dim[1]);M.k=M.k0;M.tx=0;M.ty=0;clampT();applyT();
  b.addEventListener('pointerdown',e=>{M.ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});M.moved=false;M.start={x:e.clientX,y:e.clientY,t:Date.now()};if(M.ptr.size===2){const [a,c]=[...M.ptr.values()];M.d0=Math.hypot(a.x-c.x,a.y-c.y);M.k00=M.k}});
  window.onpointermove=e=>{if(!M.ptr.has(e.pointerId)||!$('#mapbox'))return;const p=M.ptr.get(e.pointerId);const dx=e.clientX-p.x,dy=e.clientY-p.y;
    if(M.ptr.size===1){if(Math.abs(e.clientX-M.start.x)+Math.abs(e.clientY-M.start.y)>6)M.moved=true;M.tx+=dx;M.ty+=dy;clampT();applyT()}
    M.ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(M.ptr.size===2){M.moved=true;const [a,c]=[...M.ptr.values()];const d=Math.hypot(a.x-c.x,a.y-c.y);const br=b.getBoundingClientRect();zoomAt((a.x+c.x)/2-br.left,(a.y+c.y)/2-br.top,M.k00*d/M.d0)}};
  window.onpointerup=window.onpointercancel=e=>{M.ptr.delete(e.pointerId)};
  b.addEventListener('wheel',e=>{e.preventDefault();const br=b.getBoundingClientRect();zoomAt(e.clientX-br.left,e.clientY-br.top,M.k*(e.deltaY<0?1.2:1/1.2))},{passive:false});
  $('#zi').onclick=()=>zoomAt(b.clientWidth/2,b.clientHeight/2,M.k*1.4);
  $('#zo').onclick=()=>zoomAt(b.clientWidth/2,b.clientHeight/2,M.k/1.4);
  $('#zr').onclick=()=>{M.k=M.k0;M.tx=0;M.ty=0;clampT();applyT()};
}
function drawPins(){
  const svg=$('#pins');if(!svg)return; if(S.mapImg!==1){svg.innerHTML='';return}
  const r=11/M.k, fs=11/M.k;
  let h='';
  const L=EXH.filter(e=>S.mapPf.includes(e.priority)&&e.x!=null);
  if(S.mapRoute){const R=EXH.filter(e=>e.route&&e.x!=null).sort((a,b)=>a.route-b.route);
    h+=`<polyline points="${R.map(e=>e.x+','+e.y).join(' ')}" fill="none" stroke="#1F2A44" stroke-opacity=".35" stroke-width="${2.5/M.k}" stroke-dasharray="${8/M.k} ${6/M.k}"/>`}
  L.forEach(e=>{
    const v=visited(e.booth), c=v?'#2E9E5B':PCOL[e.priority];
    const lab=(S.mapRoute&&e.route)?e.route:(v?'✓':'');
    h+=`<g data-b="${esc(e.booth)}" style="cursor:pointer">${S.sel===e.booth?`<circle cx="${e.x}" cy="${e.y}" r="${r*1.9}" fill="none" stroke="#0E8F8F" stroke-width="${3/M.k}" class="pulse"/>`:''}
     <circle cx="${e.x}" cy="${e.y}" r="${r}" fill="${c}" stroke="#fff" stroke-width="${2/M.k}"/>
     ${lab!==''?`<text x="${e.x}" y="${e.y+fs*.36}" font-size="${fs}" font-weight="700" fill="#fff" text-anchor="middle" font-family="Arial">${lab}</text>`:''}</g>`;
  });
  svg.innerHTML=h;
  svg.querySelectorAll('g[data-b]').forEach(g=>g.addEventListener('click',()=>{if(M.moved)return;const e=BY[g.dataset.b];S.sel=e.booth;showMapCard(e);drawPins()}));
}

function resizeImg(file,max=1600){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res({dataUrl:c.toDataURL('image/jpeg',0.85),canvas:c})};im.onerror=rej;im.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file)})}
async function claudeRead(dataUrl,kind){
  const key=apiKey(); if(!key){toast('Set the Claude key in Setup');return null}
  const s=settings();
  const prompt=kind==='badge'
   ?'This is a conference badge. Extract: name, title, company, email, phone. Reply ONLY with JSON {"name","title","company","email","phone"}. Empty string when not visible. No markdown.'
   :'This is a business card. Extract contact info. Reply ONLY with JSON {"name","title","company","email","phone","website"}. Empty string when not found. No markdown.';
  const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:s.model,max_tokens:300,messages:[{role:'user',content:[{type:'image',source:{type:'base64',media_type:'image/jpeg',data:dataUrl.split(',')[1]}},{type:'text',text:prompt}]}]})});
  if(!res.ok){toast('Claude API error '+res.status+(res.status===401?' (check key)':''));return null}
  const j=await res.json();const t=(j.content&&j.content[0]&&j.content[0].text)||'';
  const m=t.match(/\{[\s\S]*\}/);if(!m){toast('Could not read the image');return null}
  try{return JSON.parse(m[0])}catch(e){toast('Unreadable result');return null}
}
async function handleImage(file,kind){
  toast('Reading '+kind+'…');
  try{const {dataUrl}=await resizeImg(file);const info=await claudeRead(dataUrl,kind);
    const b=S.pendingBooth||null;
    recForm(Object.assign({source:kind,booth:b},info||{}));
  }catch(e){toast('Image error');recForm({source:kind,booth:S.pendingBooth||null})}
}

let CAM={stream:null,raf:0,det:null};
async function startBadge(){
  ensureInputs();
  try{CAM.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280}},audio:false})}
  catch(e){toast('Camera blocked. Using photo capture.');$('#badgeIn').click();return}
  const d=document.createElement('div');d.id='cam';
  d.innerHTML=`<video playsinline muted autoplay></video><div class="bar"><button class="btn sec" id="cX">Cancel</button><button class="btn acc" id="cP">Photo of badge (AI read)</button></div><div style="position:absolute;top:calc(env(safe-area-inset-top) + 12px);left:0;right:0;text-align:center;color:#fff;font-size:14px;text-shadow:0 1px 3px #000">Point at the badge QR code</div>`;
  document.body.appendChild(d);const v=d.querySelector('video');v.srcObject=CAM.stream;
  if('BarcodeDetector' in window){try{CAM.det=new BarcodeDetector({formats:['qr_code']})}catch(e){CAM.det=null}}
  const cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true});
  let busy=false;
  const tick=async()=>{ if(!$('#cam'))return;
    if(v.readyState>=2&&!busy){busy=true;let txt=null;
      try{ if(CAM.det){const r=await CAM.det.detect(v);if(r.length)txt=r[0].rawValue}
        if(!txt&&window.jsQR){const w=v.videoWidth,h=v.videoHeight,sc=Math.min(1,640/w);cv.width=Math.round(w*sc);cv.height=Math.round(h*sc);cx.drawImage(v,0,0,cv.width,cv.height);const im=cx.getImageData(0,0,cv.width,cv.height);const q=jsQR(im.data,cv.width,cv.height);if(q)txt=q.data}
      }catch(e){}
      busy=false;
      if(txt){stopCam();parseBadge(txt);return}
    }
    CAM.raf=requestAnimationFrame(tick)};
  CAM.raf=requestAnimationFrame(tick);
  $('#cX').onclick=stopCam;
  $('#cP').onclick=()=>{const w=v.videoWidth,h=v.videoHeight;const c=document.createElement('canvas');const sc=Math.min(1,1600/Math.max(w,h));c.width=Math.round(w*sc);c.height=Math.round(h*sc);c.getContext('2d').drawImage(v,0,0,c.width,c.height);const du=c.toDataURL('image/jpeg',0.85);stopCam();toast('Reading badge…');claudeRead(du,'badge').then(info=>recForm(Object.assign({source:'badge',booth:S.pendingBooth||null},info||{})))};
}
function stopCam(){cancelAnimationFrame(CAM.raf);if(CAM.stream)CAM.stream.getTracks().forEach(t=>t.stop());CAM.stream=null;const d=$('#cam');if(d)d.remove()}
function parseBadge(t){
  const o={source:'badge',booth:S.pendingBooth||null,badge:t};
  if(/BEGIN:VCARD/i.test(t)){
    const g=k=>{const m=t.match(new RegExp('^'+k+'[^:]*:(.*)$','im'));return m?m[1].trim():''};
    o.name=g('FN')||g('N').split(';').reverse().join(' ').trim();o.company=g('ORG').replace(/;/g,' ').trim();o.title=g('TITLE');o.email=g('EMAIL');o.phone=g('TEL');
  }else if(/^MECARD:/i.test(t)){
    const g=k=>{const m=t.match(new RegExp(k+':([^;]*)','i'));return m?m[1]:''};o.name=g('N').split(',').reverse().join(' ').trim();o.email=g('EMAIL');o.phone=g('TEL');o.company=g('ORG');
  }else{
    try{const j=JSON.parse(t);o.name=j.name||j.fullName||'';o.company=j.company||j.org||'';o.title=j.title||'';o.email=j.email||''}catch(e){}
  }
  if(!o.name&&!o.email){o.notes='Badge code: '+t+'\n(No name inside the code. Use Photo of badge to read the printed name.)'}
  navigator.vibrate&&navigator.vibrate(60);
  recForm(o);
}

  if(!company)return null;const c=company.toLowerCase().replace(/[^a-z0-9 ]/g,'');

}

function exportCSV(){

  const b=new Blob([rows.join('\n')],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='spacepower26_log.csv';document.body.appendChild(a);a.click();setTimeout(()=>a.remove(),500);

   <div class="mut" style="margin-top:8px">${REC.length} entries on this phone. Exhibitor data: 62 companies, updated Nov 17, 2026.</div></div>`;
  const up=fn=>{const s=settings();fn(s);saveSettings(s)};
  $('#p_savekey').onclick=()=>{const v=$('#p_key').value.trim();up(s=>{if(v){s.apiKey=v;s.keyTs=Date.now()}s.model=$('#p_model').value.trim()||s.model});toast('Saved');rSet()};
  $('#p_clrkey').onclick=()=>{up(s=>{s.apiKey='';s.keyTs=0});toast('Key cleared');rSet()};
  $('#p_saveme').onclick=()=>{up(s=>{s.myName=$('#p_name').value;s.tfsTitle=$('#p_tfs').value;s.sfaTitle=$('#p_sfa').value;s.myEmail=$('#p_email').value;s.myPhone=$('#p_phone').value;s.linkedinUrl=$('#p_li').value.trim()});toast('Saved');rSet()};
  $('#p_liimg').onchange=async e=>{const f=e.target.files[0];if(!f)return;const {dataUrl}=await resizeImg(f,900);up(s=>{s.linkedinImg=dataUrl});toast('QR image saved');rSet()};
  const lc=$('#p_liclr');if(lc)lc.onclick=()=>{up(s=>{s.linkedinImg=''});rSet()};
  $('#p_saveurl').onclick=()=>{up(s=>{s.scriptUrl=$('#p_url').value.trim();s.token=$('#p_tok').value.trim()});toast('Saved')};
  $('#p_savecol').onclick=()=>{up(s=>{document.querySelectorAll('.p_curl').forEach(i=>{s.collateral[+i.dataset.i].url=i.value.trim()})});toast('Saved')};
  $('#p_exp').onclick=exportCSV;
  $('#p_wipe').onclick=()=>{if(confirm('Erase ALL entries on this phone?')&&confirm('Really erase? This cannot be undone.')){REC=[];saveRec();rSet()}};
}

/* ---------- boot ---------- */
$('#fab').onclick=()=>recForm({source:'manual'});
buildNav();updPill();render();
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){navigator.serviceWorker.register('sw.js').catch(()=>{})}
</script>
</body>
</html>
